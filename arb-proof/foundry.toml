[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.21"
optimizer = true
optimizer_runs = 200
# Mainnet post-Prague / Aave pool uses opcodes that need a recent EVM
evm_version = "prague"
ffi = false
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
mainnet = "${MAINNET_RPC}"
